{% extends 'main.html' %}

{% block content %}
<h2>Update Employee</h2>

<form method="POST">
    {% csrf_token %}

    <label>Name:</label>
    <input type="text" name="name" value="{{ employee.name }}" required>
    <br><br>

    <label>Email:</label>
    <input type="email" name="email" value="{{ employee.email }}" required>
    <br><br>

    <label>Mobile Number:</label>
    <input type="text" name="mobile_number" value="{{ employee.mobile_number }}" required>
    <br><br>

    <label>Designation:</label>
    <input type="text" name="designation" value="{{ employee.designation }}" required>
    <br><br>

    <label>Department:</label>
    <input type="text" name="department" value="{{ employee.department }}" required>
    <br><br>

    <button type="submit">Save Changes</button>
</form>
{% endblock content %}
